# Generated on omarchy by deploy/make-cpa-config.py (secrets filled from ~/pag/cpa/secrets).
# Claude/Gemini upstreams are separated by prefix; pag-front picks c4r|cvc and g4r|gvc from
# front/settings.json. force-model-prefix keeps unprefixed claude-*/gemini-* away from them,
# request-retry 0 + disable-cooling: one attempt, the error goes back to the client.
management:
  disable-auto-update-panel: true
  secret-key: "<bcrypt hash or plain secret for the management panel>"
server:
  host: "127.0.0.1"
  port: 8318
access:
  api-keys:
    - "<client key, same as secrets/client.key>"
routing:
  strategy: "round-robin"
  force-model-prefix: true
api-keys:
  claude:
    - name: 4router
      prefix: c4r
      base-url: "https://4router.net"
      request-retry: 0
      disable-cooling: true
      keys: [{api-key: "<4router.key>"}]
      models:
        - {name: "claude-haiku-5-5", alias: "claude-haiku-5-5"}
        # … one entry per 4router model
    - name: vercel-claude
      prefix: cvc
      base-url: "https://ai-gateway.vercel.sh"
      request-retry: 0
      disable-cooling: true
      keys: [{api-key: "<vercel.key>"}]
      models:
        - {name: "anthropic/claude-haiku-5.5", alias: "claude-haiku-5-5", force-mapping: true}
        # … Claude Code name -> Vercel id
  gemini:
    - name: 4router-gemini
      prefix: g4r
      base-url: "https://4router.net"
      request-retry: 0
      disable-cooling: true
      keys: [{api-key: "<4router-gemini.key>"}]
      models:
        - {name: "gemini-3.5-flash", alias: "gemini-3.5-flash"}
  openai-compatibility:
    - name: opencode-zen
      base-url: "https://opencode.ai/zen/v1"
      keys: [{api-key: "<key>"}]
      models:
        - {name: big-pickle, alias: opencode-free}
        - {name: beam-free, alias: opencode-free}
        - {name: mimo-v2.6-flash-free, alias: opencode-free}
        - {name: deepseek-v4.1-flash-free, alias: opencode-free}
        - {name: glm-5.3-flash-free, alias: opencode-free}
    - name: vercel-gemini   # Gemini native requests are translated to OpenAI chat by CLIProxyAPI
      prefix: gvc
      base-url: "https://ai-gateway.vercel.sh/v1"
      request-retry: 0
      disable-cooling: true
      keys: [{api-key: "<vercel.key>"}]
      models:
        - {name: "google/gemini-2.5-flash", alias: "gemini-2.5-flash"}

observability:
  logs:
    logging-to-file: true
    logs-max-total-size-mb: 500
    request-log: false
